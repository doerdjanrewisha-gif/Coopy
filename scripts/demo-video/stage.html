<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coopy demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, 'Helvetica Neue', Arial, sans-serif; color: #1b1b1b; }
  body { background: radial-gradient(1200px 800px at 75% 40%, #ffffff 0%, #f3f3f3 55%, #e8e8e8 100%); }
  .left { position: absolute; left: 130px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 46px; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: #e2001a; color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 46px; padding-bottom: 6px; }
  .brand b { font-size: 52px; font-weight: 900; letter-spacing: -0.02em; }
  .brand span { display: block; font-size: 20px; font-weight: 600; color: #707070; letter-spacing: 0; margin-top: 2px; }
  .step-no { font-size: 22px; font-weight: 800; color: #e2001a; text-transform: uppercase; letter-spacing: 0.08em; height: 30px; }
  .caption { font-size: 64px; line-height: 1.08; font-weight: 900; letter-spacing: -0.025em; margin-top: 14px; min-height: 150px; }
  .sub { font-size: 28px; line-height: 1.4; color: #4a4a4a; margin-top: 22px; max-width: 760px; min-height: 80px; font-weight: 500; }
  .fade { transition: opacity .35s, transform .35s; }
  .hide { opacity: 0; transform: translateY(12px); }
  .dots { display: flex; gap: 10px; margin-top: 56px; }
  .dots i { width: 38px; height: 6px; border-radius: 3px; background: #d6d6d6; transition: background .3s; }
  .dots i.on { background: #e2001a; }
  .foot { position: absolute; left: 130px; bottom: 54px; font-size: 18px; color: #8a8a8a; font-weight: 600; }
  .phone { position: absolute; right: 230px; top: 50%; width: 430px; height: 912px; transform: translateY(-50%) scale(1.06); transform-origin: center; border-radius: 64px; background: #111; padding: 20px; box-shadow: 0 40px 80px rgba(0,0,0,.25), inset 0 0 0 2px #333; }
  .phone::before { content: ''; position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; border-radius: 16px; background: #000; z-index: 3; }
  .screen { width: 390px; height: 872px; border-radius: 46px; overflow: hidden; background: #fff; position: relative; }
  .status { position: absolute; z-index: 2; top: 0; left: 0; right: 0; height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0; font-size: 16px; font-weight: 700; color: #fff; pointer-events: none; mix-blend-mode: difference; }
  iframe { position: absolute; top: 28px; left: 0; width: 390px; height: 844px; border: 0; }
  .intro { position: absolute; inset: 0; background: #e2001a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10; transition: opacity .6s; }
  .intro .mark { background: #fff; color: #e2001a; width: 120px; height: 120px; font-size: 80px; border-radius: 32px; margin-bottom: 34px; }
  .intro h1 { font-size: 110px; font-weight: 900; letter-spacing: -0.03em; }
  .intro p { font-size: 36px; font-weight: 600; margin-top: 14px; opacity: .95; }
  .intro small { font-size: 22px; margin-top: 40px; opacity: .85; font-weight: 600; }
  .gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><div class="mark">c</div><div><b>Coopy</b><span>Your dinner helper in the Coop app</span></div></div>
    <div class="fade" id="txt">
      <div class="step-no" id="no"></div>
      <div class="caption" id="cap"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="foot">Student concept for Coop Norway · All Stars Consultancy · prices, stock and aisles are illustrative demo data</div>
  <div class="phone"><div class="screen"><div class="status"><span>17:42</span><span>●●● 5G ▮</span></div><iframe id="app" src="about:blank"></iframe></div></div>
  <div class="intro" id="intro">
    <div class="mark">c</div>
    <h1>Coopy</h1>
    <p>What's for dinner? Ask Coopy, then find it in the store.</p>
    <small>Student concept for Coop Norway · All Stars Consultancy</small>
  </div>
<script>
  const TOTAL = 9;
  const dots = document.getElementById('dots');
  for (let i = 0; i < TOTAL; i++) dots.appendChild(document.createElement('i'));
  window.setStep = (n, cap, sub) => {
    const t = document.getElementById('txt');
    t.classList.add('hide');
    setTimeout(() => {
      document.getElementById('no').textContent = n ? `Step ${n} of ${TOTAL}` : '';
      document.getElementById('cap').textContent = cap;
      document.getElementById('sub').textContent = sub || '';
      [...dots.children].forEach((d, i) => d.classList.toggle('on', i < n));
      t.classList.remove('hide');
    }, 350);
  };
  window.hideIntro = () => document.getElementById('intro').classList.add('gone');
  window.showOutro = (title, sub) => {
    const el = document.getElementById('intro');
    el.querySelector('h1').textContent = title;
    el.querySelector('p').textContent = sub;
    el.classList.remove('gone');
  };
</script>
</body>
</html>
